[package]
name = "bifrost-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "BIFRÖST — Windows 11 Fluent Design desktop application backed by Rust and Tauri 2."

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bifrost-bridge = { path = "../../../crates/bifrost-bridge" }
bifrost-core = { path = "../../../crates/bifrost-core" }
bifrost-diagnostics = { path = "../../../crates/bifrost-diagnostics" }
bifrost-client = { path = "../../../crates/bifrost-client" }
bifrost-display = { path = "../../../crates/bifrost-display" }
bifrost-network = { path = "../../../crates/bifrost-network" }
bifrost-process = { path = "../../../crates/bifrost-process" }
bifrost-runtime = { path = "../../../crates/bifrost-runtime" }
bifrost-storage = { path = "../../../crates/bifrost-storage" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.4"
tokio.workspace = true
tracing.workspace = true
valhalla = { path = "../../../crates/valhalla" }

[target.'cfg(windows)'.dependencies]
rfd = { version = "0.15", default-features = false }
