[package]
name = "heimdall"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Heimdall — Background daemon, Midgard runtime supervisor, health monitor, and authenticated local IPC server for BIFRÖST."

[lints]
workspace = true

[[bin]]
name = "heimdall"
path = "src/main.rs"

[dependencies]
bifrost-bridge = { path = "../bifrost-bridge" }
bifrost-core = { path = "../bifrost-core" }
bifrost-runtime = { path = "../bifrost-runtime" }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
] }

[dev-dependencies]
tempfile.workspace = true
