name: BIFRÖST Deep Fuzz

# Runs the property-based fuzz suites (tests/fuzz_untrusted_inputs.rs in each crate)
# with many more cases than the per-commit CI. New failures are shrunk by proptest and
# printed as a minimal input; commit the generated .proptest-regressions file with the fix.

on:
  schedule:
    - cron: "17 3 * * 1"   # Mondays 03:17 UTC
  workflow_dispatch:
    inputs:
      cases:
        description: "Cases per property"
        required: false
        default: "20000"

permissions:
  contents: read

jobs:
  fuzz:
    name: Deep property fuzzing
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PROPTEST_CASES: ${{ github.event.inputs.cases || '20000' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Run fuzz suites
        shell: pwsh
        run: |
          cargo test --workspace --locked --release --test fuzz_untrusted_inputs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
