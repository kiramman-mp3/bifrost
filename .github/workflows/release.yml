name: BIFRÖST Release

# Builds, optionally Authenticode-signs, attests and publishes a Windows x64 release
# whenever a version tag (vX.Y.Z) is pushed. Releases are always built here with the
# MSVC toolchain, never from a developer machine.
#
# Optional repository secrets for Authenticode signing:
#   WINDOWS_SIGNING_PFX_BASE64    base64 of a code-signing .pfx
#   WINDOWS_SIGNING_PFX_PASSWORD  its password
# Without them the release is published UNSIGNED and the notes say so.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.4.0"
        required: true

permissions:
  contents: write      # create the GitHub Release
  id-token: write      # Sigstore OIDC for build provenance
  attestations: write  # store the provenance attestation

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish Windows x64 release
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      CARGO_TARGET_DIR: ${{ github.workspace }}\target
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Verify tag matches workspace version
        shell: pwsh
        run: |
          $toml = Get-Content Cargo.toml -Raw
          if ($toml -notmatch '(?ms)^\[workspace\.package\].*?^version\s*=\s*"([^"]+)"') { throw "No workspace version" }
          $version = $Matches[1]
          if ("v$version" -ne $env:TAG) { throw "Tag $env:TAG does not match workspace version v$version" }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Quality gates
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --workspace --all-targets --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --workspace --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Decode signing certificate
        id: cert
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PFX_BASE64)) {
            Write-Warning "No signing certificate secret: release will be UNSIGNED."
            "signed=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "bifrost-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          "BIFROST_SIGN_PFX_PATH=$pfx" >> $env:GITHUB_ENV
          "signed=true" >> $env:GITHUB_OUTPUT

      - name: Build release bundle
        shell: pwsh
        env:
          BIFROST_SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: .\installer\windows\build-release-bundle.ps1 -OutputDir .\dist\bifrost-win64 -Zip

      - name: Remove signing certificate
        if: always()
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "bifrost-signing.pfx"
          if (Test-Path $pfx) { Remove-Item -Force $pfx }

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/bifrost-v${{ env.VERSION }}-win64.zip
            dist/bifrost-win64/*.exe

      - name: Extract release notes from CHANGELOG
        shell: pwsh
        run: |
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($env:VERSION))\]").LineNumber
          if (-not $start) { throw "CHANGELOG.md has no section for $env:VERSION" }
          $body = @()
          for ($i = $start; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^## \[') { break }
            $body += $lines[$i]
          }
          if ("${{ steps.cert.outputs.signed }}" -ne "true") {
            $body += ""
            $body += "> [!WARNING]"
            $body += "> These binaries are **not Authenticode-signed**; Windows SmartScreen may warn on first run. Verify the download with ``release-checksums.sha256`` and ``gh attestation verify``."
          }
          $body += ""
          $body += "Verify provenance: ``gh attestation verify bifrost-v$env:VERSION-win64.zip --repo ${{ github.repository }}``"
          Set-Content -Path release-notes.md -Value $body -Encoding utf8

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "dist/bifrost-v$env:VERSION-win64.zip"
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $zip "$zip.sha256" dist/bifrost-win64/release-checksums.sha256 --clobber
          } else {
            gh release create $env:TAG $zip "$zip.sha256" dist/bifrost-win64/release-checksums.sha256 `
              --title "BIFRÖST $env:TAG" --notes-file release-notes.md --verify-tag
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
